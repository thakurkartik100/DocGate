<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocGate</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #6b6560; --card: #ffffff; --line: #e7e5e4; --accent: #2563eb; --warn: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161514; --fg: #f5f5f4; --muted: #a8a29e; --card: #201f1d; --line: #34322f; --accent: #60a5fa; --warn: #f59e0b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 320px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  label.opt { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; margin-top: 8px; }
  .examples { margin: 12px 0 24px; color: var(--muted); font-size: .9rem; }
  .examples button { background: none; color: var(--accent); padding: 0 6px; text-decoration: underline; }
  .status { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .status.warn { color: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .card h2 { margin: 0 0 6px; font-size: 1rem; font-family: ui-monospace, monospace; }
  .card .score { color: var(--muted); font-size: .8rem; float: right; }
  .card pre { margin: 0; white-space: pre-wrap; font: .85rem/1.45 ui-monospace, monospace; color: var(--muted); }
  .answer { border-left: 3px solid var(--accent); }
  .answer p { margin: 0 0 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>DocGate</h1>
  <p class="sub">Ask a question about the Python standard library. Hybrid search, reranking, and an "I don't know" when the question is out of scope.</p>
  <form id="f">
    <input id="q" type="text" placeholder="e.g. split a string using a regular expression" required minlength="3" maxlength="500" aria-label="Question">
    <button id="go" type="submit">Search</button>
  </form>
  <label class="opt"><input id="gen" type="checkbox"> Also write an answer with Claude (needs an API key on the server)</label>
  <div class="examples">Try:
    <button type="button">delete a folder and everything inside it</button>
    <button type="button">run several awaitables concurrently</button>
    <button type="button">best pizza recipe</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="out"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  // Build nodes with textContent only: snippets come from docstrings and must never be parsed as HTML.
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  async function ask(q) {
    $("go").disabled = true; $("out").replaceChildren(); $("status").className = "status"; $("status").textContent = "Searching…";
    try {
      const r = await fetch("/query", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ q, k: 5, generate: $("gen").checked }) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail ? (typeof data.detail === "string" ? data.detail : "Invalid question") : r.statusText);
      if (!data.answered) {
        $("status").className = "status warn";
        $("status").textContent = "No confident match in the standard library docs, so DocGate is not answering.";
        return;
      }
      $("status").textContent = `${data.passages.length} passages in ${data.latency_ms} ms${data.cached ? " (cached)" : ""}`;
      if (data.answer) {
        const a = el("div", "card answer");
        a.append(el("h2", null, "Answer"), el("p", null, data.answer));
        if (data.citations.length) a.append(el("pre", null, "Cites: " + data.citations.join(", ")));
        $("out").append(a);
      }
      for (const p of data.passages) {
        const c = el("div", "card");
        c.append(el("span", "score", "score " + p.score), el("h2", null, p.id), el("pre", null, p.snippet));
        $("out").append(c);
      }
    } catch (e) {
      $("status").className = "status warn"; $("status").textContent = "Error: " + e.message;
    } finally { $("go").disabled = false; }
  }
  $("f").addEventListener("submit", (e) => { e.preventDefault(); ask($("q").value.trim()); });
  document.querySelectorAll(".examples button").forEach((b) => b.addEventListener("click", () => { $("q").value = b.textContent; ask(b.textContent); }));
</script>
</body>
</html>
